# ElevIQ booking gateway — Cloudflare Worker configuration.
# Deploy from this directory with:  npx wrangler deploy
# (requires a one-time `npx wrangler login` on this machine)

name = "eleviq-booking-gateway"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Worker logs in the Cloudflare dashboard — this is the funnel-evidence
# source for the validation report (agent requests → bookings).
[observability]
enabled = true

# Cloudflare's Workers rate-limiting binding (keyed per client IP in code).
# Booking attempts: 5 per minute per IP.
[[unsafe.bindings]]
name = "BOOK_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Read/other requests (slots, MCP calls): 60 per minute per IP.
[[unsafe.bindings]]
name = "READ_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Web Bot Auth nonce replay protection (src/verify.js) — NOT yet created.
# Without this binding, checkSignedAgent() still verifies signatures fully;
# it just skips the replay check (a captured-but-still-valid signature could
# be resent until its own `expires`). To enable:
#   npx wrangler kv namespace create eleviq-booking-nonces
# then uncomment below with the printed id:
# [[kv_namespaces]]
# binding = "NONCES"
# id = "<paste id here>"
